<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orbit — Spotify Creative Labs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:          #0a0a0a;
  --surface:     #141414;
  --card:        #1a1a1a;
  --card-hover:  #222222;
  --border:      #2a2a2a;
  --green:       #1ED760;
  --green-hover: #1DB954;
  --white:       #FFFFFF;
  --grey:        #A7A7A7;
  --dark-grey:   #404040;
  --radius:      12px;
  --radius-sm:   8px;

  --cat-film:     #C084FC;
  --cat-music:    #1DB954;
  --cat-sports:   #60A5FA;
  --cat-politics: #FB923C;
  --cat-cultural: #F472B6;
  --cat-holidays: #34D399;
  --cat-history:  #FBBF24;
  --cat-awards:   #818CF8;
  --cat-pop:      #F87171;
  --cat-aus:      #FCD34D;
}

html { font-size: 16px; scroll-behavior: smooth; }

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg);
  color: var(--white);
  min-height: 100vh;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

/* ── NAV ─────────────────────────────────── */
nav {
  position: sticky; top: 0; z-index: 100;
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 32px;
  background: rgba(10,10,10,0.92);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
}

.nav-brand {
  display: flex; align-items: center; gap: 10px;
  text-decoration: none; color: var(--white);
}

.nav-brand svg { width: 28px; height: 28px; flex-shrink: 0; }

.nav-brand-text {
  font-size: 18px; font-weight: 900; letter-spacing: -0.5px;
}

.nav-brand-text span { color: var(--green); }

.nav-tag {
  font-size: 12px; color: var(--grey); font-weight: 400;
  display: none;
}
@media (min-width: 640px) { .nav-tag { display: block; } }

.nav-browse-btn {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--grey);
  padding: 8px 16px;
  border-radius: 20px;
  font-family: inherit;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: all .2s;
}
.nav-browse-btn:hover { border-color: var(--white); color: var(--white); }

/* ── HERO ────────────────────────────────── */
.hero-wrapper {
  position: relative;
  overflow: hidden;
}
.hero-glow {
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 500px;
  background: radial-gradient(ellipse 80% 50% at 50% 0%, rgba(30,215,96,0.2) 0%, transparent 70%);
  pointer-events: none;
  z-index: 0;
}
.hero {
  position: relative;
  z-index: 1;
  padding: 72px 24px 52px;
  max-width: 820px;
  margin: 0 auto;
  text-align: center;
}

.hero h1 {
  font-size: clamp(40px, 7vw, 72px);
  font-weight: 900;
  letter-spacing: -2px;
  line-height: 1.05;
  margin-bottom: 20px;
}
.hero h1 .green { color: var(--green); }

.hero p {
  font-size: clamp(15px, 2vw, 18px);
  color: var(--grey);
  margin-bottom: 40px;
  font-weight: 400;
}

/* ── SEARCH CARD ─────────────────────────── */
.search-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 28px;
  text-align: left;
}

.field-label {
  display: block;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 1.2px;
  text-transform: uppercase;
  color: var(--grey);
  margin-bottom: 10px;
}

.brief-input {
  width: 100%;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  color: var(--white);
  font-family: inherit;
  font-size: 15px;
  line-height: 1.6;
  resize: none;
  min-height: 96px;
  transition: border-color .2s;
  margin-bottom: 24px;
}
.brief-input::placeholder { color: var(--dark-grey); }
.brief-input:focus { outline: none; border-color: var(--green); }

/* Market chips */
.market-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 24px;
}

.market-chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 14px;
  border-radius: 20px;
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--grey);
  font-family: inherit;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: all .18s;
  user-select: none;
}
.market-chip:hover { border-color: var(--grey); color: var(--white); }
.market-chip.active {
  background: var(--green);
  border-color: var(--green);
  color: #000;
  font-weight: 600;
}
.market-chip .flag { font-size: 15px; }

/* Optional filter row */
.filter-toggle {
  background: none;
  border: none;
  color: var(--dark-grey);
  font-family: inherit;
  font-size: 13px;
  cursor: pointer;
  display: flex; align-items: center; gap: 4px;
  margin-bottom: 12px;
  transition: color .2s;
  padding: 0;
}
.filter-toggle:hover { color: var(--grey); }
.filter-toggle .arrow { transition: transform .2s; display: inline-block; }
.filter-toggle.open .arrow { transform: rotate(90deg); }

.filter-panel {
  display: none;
  gap: 16px;
  flex-wrap: wrap;
  margin-bottom: 20px;
}
.filter-panel.open { display: flex; }

.filter-group { display: flex; flex-direction: column; gap: 8px; flex: 1; min-width: 200px; }
.filter-group .field-label { margin-bottom: 4px; }

.chip-row { display: flex; flex-wrap: wrap; gap: 6px; }

.cat-chip {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 5px 12px;
  border-radius: 14px;
  border: 1px solid var(--border);
  background: transparent;
  font-family: inherit;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  transition: all .18s;
  color: var(--grey);
}
.cat-chip:hover { border-color: currentColor; }
.cat-chip.active { background: var(--cat-color); border-color: var(--cat-color); color: #000; }
.cat-chip .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--cat-color); }

.month-chip {
  padding: 5px 12px;
  border-radius: 14px;
  border: 1px solid var(--border);
  background: transparent;
  font-family: inherit;
  font-size: 12px;
  color: var(--grey);
  cursor: pointer;
  transition: all .18s;
}
.month-chip:hover { border-color: var(--grey); color: var(--white); }
.month-chip.active { background: var(--dark-grey); border-color: var(--grey); color: var(--white); }

/* Search button */
.search-btn {
  width: 100%;
  background: var(--green);
  color: #000;
  border: none;
  border-radius: 40px;
  padding: 16px;
  font-family: inherit;
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 0.2px;
  cursor: pointer;
  transition: all .18s;
  margin-top: 4px;
}
.search-btn:hover { background: var(--green-hover); transform: scale(1.01); }
.search-btn:active { transform: scale(0.99); }

/* ── RESULTS ─────────────────────────────── */
.results-section {
  max-width: 1200px;
  margin: 0 auto;
  padding: 0 24px 80px;
}

.results-header {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  margin-bottom: 28px;
  flex-wrap: wrap;
  gap: 8px;
}

.results-title {
  font-size: 22px;
  font-weight: 700;
}
.results-title .count { color: var(--green); }
.results-meta {
  font-size: 13px;
  color: var(--grey);
  margin-top: 4px;
}

.clear-btn {
  background: none;
  border: 1px solid var(--border);
  color: var(--grey);
  border-radius: 16px;
  padding: 6px 14px;
  font-family: inherit;
  font-size: 12px;
  cursor: pointer;
  transition: all .18s;
}
.clear-btn:hover { border-color: var(--grey); color: var(--white); }

/* Cards grid */
.cards-grid {
  display: flex;
  flex-direction: column;
  gap: 20px;
}
.cards-regular-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 16px;
}
.cards-duo-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}
@media (max-width: 640px) {
  .cards-duo-grid { grid-template-columns: 1fr; }
}

/* ── FEATURED CARD (rank 1) ──────────────── */
.event-card-featured {
  background: var(--card);
  border: 1px solid var(--border);
  border-left: 4px solid var(--green);
  border-radius: var(--radius);
  padding: 0;
  display: flex; flex-direction: row;
  min-height: 260px;
  position: relative;
  overflow: hidden;
  box-shadow: 0 0 40px rgba(30,215,96,0.5), 0 0 80px rgba(30,215,96,0.2);
  transition: all .2s;
}
.event-card-featured:hover {
  transform: translateY(-2px);
  box-shadow: 0 0 50px rgba(30,215,96,0.6), 0 0 100px rgba(30,215,96,0.25);
}
.event-card-featured .featured-rank {
  position: absolute;
  bottom: -20px; left: 20px;
  font-size: 160px;
  font-weight: 900;
  line-height: 1;
  color: var(--white);
  opacity: 0.04;
  pointer-events: none;
  user-select: none;
  letter-spacing: -8px;
}
.event-card-featured .featured-left {
  flex: 0 0 60%;
  padding: 32px 28px;
  display: flex; flex-direction: column; gap: 14px;
  justify-content: space-between;
}
.event-card-featured .featured-right {
  flex: 0 0 40%;
  padding: 32px 28px;
  background: rgba(30,215,96,0.04);
  border-left: 1px solid rgba(30,215,96,0.15);
  display: flex; flex-direction: column; justify-content: center;
}
.featured-label {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 10px; font-weight: 700;
  letter-spacing: 2px; text-transform: uppercase;
  color: var(--green);
  margin-bottom: 4px;
}
.featured-name {
  font-size: clamp(28px, 3.5vw, 44px);
  font-weight: 900;
  line-height: 1.1;
  letter-spacing: -1px;
  color: var(--white);
}
.featured-meta {
  display: flex; align-items: center; gap: 10px;
  flex-wrap: wrap;
}
.featured-date {
  font-size: 14px; font-weight: 600;
  color: var(--grey);
}
.featured-region {
  font-size: 14px; color: var(--dark-grey);
}
.featured-region::before { content: '·'; margin-right: 10px; }
.featured-cat-badge {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 5px 12px;
  border-radius: 20px;
  font-size: 12px; font-weight: 700;
  background: rgba(255,255,255,0.07);
}
.featured-pull-quote {
  font-size: 18px;
  font-weight: 600;
  line-height: 1.5;
  color: var(--white);
  font-style: italic;
  margin-bottom: 16px;
}
.featured-pull-quote::before { content: '"'; color: var(--green); font-size: 28px; line-height: 0; vertical-align: -8px; margin-right: 4px; }
.featured-pull-quote::after  { content: '"'; color: var(--green); font-size: 28px; line-height: 0; vertical-align: -8px; margin-left: 4px; }
.featured-markets {
  display: flex; flex-wrap: wrap; gap: 4px;
}

/* ── SEMI-FEATURED CARD (rank 2-3) ────────── */
.event-card-semi {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 22px;
  display: flex; flex-direction: column; gap: 12px;
  transition: all .2s;
  cursor: default;
  position: relative;
  overflow: hidden;
  box-shadow: 0 0 25px rgba(155,89,182,0.4);
}
.event-card-semi:hover {
  border-color: rgba(155,89,182,0.4);
  transform: translateY(-2px);
  box-shadow: 0 0 35px rgba(155,89,182,0.5);
}
.event-card-semi::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: var(--accent-color, var(--border));
  border-radius: var(--radius) var(--radius) 0 0;
}
.event-card-semi .card-rank {
  position: absolute;
  bottom: -12px; right: 16px;
  font-size: 80px;
  font-weight: 900;
  line-height: 1;
  color: var(--white);
  opacity: 0.05;
  pointer-events: none;
  user-select: none;
  letter-spacing: -4px;
}

/* ── REGULAR CARD (rank 4+) ──────────────── */
.event-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  display: flex; flex-direction: column; gap: 12px;
  transition: all .2s;
  cursor: default;
  position: relative;
  overflow: hidden;
}
.event-card:hover {
  border-color: #333;
  transform: translateY(-2px);
  box-shadow: 0 8px 32px rgba(0,0,0,0.4);
}
.event-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: var(--accent-color, var(--border));
  border-radius: var(--radius) var(--radius) 0 0;
}
.event-card .card-rank {
  position: absolute;
  bottom: -12px; right: 12px;
  font-size: 64px;
  font-weight: 900;
  line-height: 1;
  color: var(--white);
  opacity: 0.04;
  pointer-events: none;
  user-select: none;
  letter-spacing: -3px;
}

/* glow variants for rank 4-6 */
.event-card.glow-faint {
  box-shadow: 0 0 15px rgba(155,89,182,0.2);
}

.card-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 8px;
}

.cat-badge {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 4px 10px;
  border-radius: 10px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.3px;
  background: rgba(255,255,255,0.07);
  color: var(--cat-c);
}

.priority-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
  margin-top: 4px;
}
.priority-dot.HIGH   { background: #1DB954; }
.priority-dot.MEDIUM { background: #FFAA00; }
.priority-dot.LOW    { background: #535353; }

.card-name {
  font-size: 16px;
  font-weight: 700;
  line-height: 1.3;
  color: var(--white);
}

.card-meta {
  display: flex; align-items: center; gap: 8px;
  flex-wrap: wrap;
}

.card-date {
  font-size: 12px;
  color: var(--dark-grey);
  font-weight: 500;
}
.card-region {
  font-size: 12px;
  color: var(--dark-grey);
}
.card-region::before { content: '·'; margin-right: 8px; }

.card-relevance {
  font-size: 13px;
  color: var(--green);
  font-style: italic;
  font-weight: 400;
  line-height: 1.4;
}

.card-tm-link {
  font-size: 11px;
  color: var(--grey);
  text-decoration: none;
  display: block;
  margin-top: 4px;
}
.card-tm-link:hover { color: var(--green); }

.card-reddit-badge {
  display: inline-flex; align-items: center;
  padding: 2px 8px; border-radius: 4px; font-size: 10px; font-weight: 700;
  color: #FF4500; background: rgba(255,69,0,0.12); border: 1px solid rgba(255,69,0,0.3);
}
.card-timing-badge {
  display: inline-flex; align-items: center; margin-left: 8px;
  padding: 2px 8px; border-radius: 4px; font-size: 10px; font-weight: 700;
  color: #fbbf24; background: rgba(251,191,36,0.12); border: 1px solid rgba(251,191,36,0.35);
}
.card-gig-badge {
  display: inline-flex; align-items: center;
  padding: 2px 8px; border-radius: 4px; font-size: 10px; font-weight: 700;
  color: #a78bfa; background: rgba(167,139,250,0.12); border: 1px solid rgba(167,139,250,0.35);
}
.card-live-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: #fff;
  background: rgba(255,60,60,0.85);
  padding: 2px 7px;
  border-radius: 20px;
  margin-bottom: 4px;
}

.card-generated-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--green);
  background: rgba(30,215,96,0.12);
  border: 1px solid rgba(30,215,96,0.3);
  padding: 2px 7px;
  border-radius: 20px;
  margin-bottom: 4px;
}

.card-ai-reason {
  font-size: 12px;
  color: var(--grey);
  line-height: 1.4;
  background: rgba(29,185,84,0.07);
  border-left: 2px solid var(--green);
  padding: 6px 10px;
  border-radius: 0 6px 6px 0;
  margin-top: 2px;
}

.card-markets {
  display: flex; flex-wrap: wrap; gap: 4px;
  margin-top: auto;
}
.market-tag {
  font-size: 11px;
  padding: 3px 8px;
  border-radius: 8px;
  background: rgba(255,255,255,0.06);
  color: var(--grey);
  font-weight: 500;
}
.market-tag.global {
  color: var(--green);
  background: rgba(29,185,84,0.1);
}

.copy-btn {
  position: absolute;
  bottom: 12px; right: 12px;
  background: rgba(255,255,255,0.08);
  border: none;
  border-radius: 6px;
  padding: 4px 8px;
  color: var(--grey);
  font-family: inherit;
  font-size: 11px;
  cursor: pointer;
  opacity: 0;
  transition: all .18s;
}
.event-card:hover .copy-btn { opacity: 1; }
.copy-btn:hover { background: rgba(255,255,255,0.15); color: var(--white); }
.copy-btn.copied { color: var(--green); }

/* Empty state */
.empty-state {
  text-align: center;
  padding: 64px 24px;
  color: var(--grey);
}
.empty-state .emoji { font-size: 48px; margin-bottom: 16px; }
.empty-state h3 { font-size: 18px; color: var(--white); margin-bottom: 8px; }
.empty-state p { font-size: 14px; max-width: 340px; margin: 0 auto; }

/* ── BROWSE ──────────────────────────────── */
.browse-section {
  max-width: 900px;
  margin: 0 auto;
  padding: 0 24px 80px;
}

.browse-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 24px; flex-wrap: wrap; gap: 12px;
}
.browse-title { font-size: 22px; font-weight: 700; }

.browse-filters {
  display: flex; flex-wrap: wrap; gap: 6px;
  margin-bottom: 28px;
}

.month-block { margin-bottom: 36px; }
.month-label {
  font-size: 11px; font-weight: 700;
  letter-spacing: 2px; text-transform: uppercase;
  color: var(--dark-grey);
  margin-bottom: 12px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--border);
}

.browse-event {
  display: flex; align-items: flex-start; gap: 14px;
  padding: 12px 0;
  border-bottom: 1px solid rgba(255,255,255,0.04);
  transition: background .15s;
}
.browse-event:last-child { border-bottom: none; }

.browse-date {
  font-size: 12px; color: var(--dark-grey);
  font-weight: 600; min-width: 64px;
  padding-top: 2px;
}

.browse-dot {
  width: 10px; height: 10px; border-radius: 50%;
  flex-shrink: 0; margin-top: 4px;
}

.browse-content { flex: 1; min-width: 0; }
.browse-name {
  font-size: 14px; font-weight: 600; color: var(--white);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.browse-relevance {
  font-size: 12px; color: var(--green); font-style: italic; margin-top: 2px;
}

.browse-cat {
  font-size: 10px; font-weight: 600;
  padding: 3px 8px; border-radius: 6px;
  background: rgba(255,255,255,0.05);
  flex-shrink: 0; align-self: flex-start; margin-top: 2px;
}

/* ── DIVIDER ─────────────────────────────── */
.section-divider {
  border: none;
  border-top: 1px solid var(--border);
  margin: 0 24px 48px;
  max-width: 1200px;
  margin-left: auto; margin-right: auto;
}

/* ── FOOTER ──────────────────────────────── */
footer {
  border-top: 1px solid var(--border);
  padding: 24px 32px;
  display: flex; align-items: center; justify-content: space-between;
  flex-wrap: wrap; gap: 8px;
}
.footer-brand { display: flex; align-items: center; gap: 8px; }
.footer-brand svg { width: 20px; height: 20px; opacity: .6; }
.footer-text { font-size: 12px; color: var(--dark-grey); }

/* ── LOADING STATE ───────────────────────── */
.loading-state {
  grid-column: 1 / -1;
  text-align: center;
  padding: 60px 24px;
  display: flex; flex-direction: column; align-items: center; gap: 20px;
}
.loading-pulse {
  width: 56px; height: 56px;
  border-radius: 50%;
  background: var(--green);
  animation: pulseGlow 1.4s ease-in-out infinite;
}
@keyframes pulseGlow {

function formatDate(d) {
  const [y,m,day] = d.split('-');
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return day ? `${parseInt(day)} ${months[parseInt(m)-1]} ${y}` : `${months[parseInt(m)-1]} ${y}`;
}

  'IN': 'IN', 'JP': 'JP', 'AR': 'AR', 'ZA': 'ZA'

async function fetchTicketmasterEvents(markets, startDate, endDate) {
  try {
    // Build country codes from selected markets (max 5 for API)
    const countries = (markets.length > 0 ? markets : Object.keys(TM_COUNTRY_MAP))
      .slice(0, 5)
      .map(m => TM_COUNTRY_MAP[m])
      .filter(Boolean)
      .join(',');

    const start = startDate || new Date().toISOString().split('T')[0] + 'T00:00:00Z';
    const end   = endDate   || new Date(Date.now() + 180 * 24 * 60 * 60 * 1000).toISOString().split('T')[0] + 'T00:00:00Z';

    const tmParams = `countryCode=${countries}&startDateTime=${start}&endDateTime=${end}&size=50&sort=relevance,desc&classificationName=music,sports,arts`;
    const url = IS_NETLIFY
      ? `/api/ticketmaster?${tmParams}`
      : `https://app.ticketmaster.com/discovery/v2/events.json?apikey=${TICKETMASTER_API_KEY}&${tmParams}`;

    const resp = await fetch(url);
    if (!resp.ok) return [];
    const data = await resp.json();
    const items = data._embedded?.events || [];

    return items.map(ev => ({
      id: 'tm_' + ev.id,
      name: ev.name,
      date: ev.dates?.start?.localDate || '',
      cat: mapTMCategory(ev.classifications?.[0]?.segment?.name),
      region: ev.venues?.[0] ? `${ev.venues[0].city?.name || ''}, ${ev.venues[0].country?.name || ''}` : 'Unknown',
      mkts: markets.length > 0 ? markets : ['GLOBAL'],
      rel: '',
      pri: 'MEDIUM',
      tags: [],
      isLive: true,
      source: 'Ticketmaster',
      url: ev.url || ''
    }));
  } catch (e) {
    console.warn('Ticketmaster fetch failed:', e);
    return [];
  }
}

function getSubredditsForBrief(brief) {
  const text = brief.toLowerCase();
  const subs = new Set(['australia']); // always include r/australia for AU briefs
  if (/kfc|mcdonald|burger|pizza|food|restaurant|eat|drink|beverage|boba|coffee|alcohol|beer|wine|spirits|cocktail|fast food/i.test(text)) {
    INDUSTRY_SUBREDDITS.food.forEach(s => subs.add(s));
    INDUSTRY_SUBREDDITS.beverage.forEach(s => subs.add(s));
  }
  if (/travel|cruise|holiday|tourism|hotel|flight|resort|destination|adventure|vacation/i.test(text)) {
    INDUSTRY_SUBREDDITS.travel.forEach(s => subs.add(s));
    INDUSTRY_SUBREDDITS.cruise.forEach(s => subs.add(s));
  }
  if (/fashion|clothing|apparel|style|wear|beauty|makeup|skincare|cosmetic/i.test(text)) {
    INDUSTRY_SUBREDDITS.fashion.forEach(s => subs.add(s));
    INDUSTRY_SUBREDDITS.beauty.forEach(s => subs.add(s));
  }
  if (/tech|app|software|digital|ai|mobile|phone|computer|gaming|game|esport/i.test(text)) {
    INDUSTRY_SUBREDDITS.tech.forEach(s => subs.add(s));
    INDUSTRY_SUBREDDITS.gaming.forEach(s => subs.add(s));
  }
  if (/sport|afl|nrl|cricket|tennis|football|rugby|basketball|fitness|gym|workout/i.test(text)) {
    INDUSTRY_SUBREDDITS.sport.forEach(s => subs.add(s));
    INDUSTRY_SUBREDDITS.fitness.forEach(s => subs.add(s));
  }
  if (/finance|bank|insurance|super|invest|mortgage|loan|money|fintech/i.test(text)) {
    INDUSTRY_SUBREDDITS.finance.forEach(s => subs.add(s));
  }
  if (/car|vehicle|ev|electric|driv|motor|auto/i.test(text)) {
    INDUSTRY_SUBREDDITS.auto.forEach(s => subs.add(s));
  }
  // Always add some general trending culture
  subs.add('GenZ');
  subs.add('australia');
  return [...subs].slice(0, 6); // limit to 6 subreddits
}

// Internet trends right now via /api/trending: Google Trends (per market), Bluesky, Reddit
async function fetchTrending(brief, markets) {
  try {
    const subs = getSubredditsForBrief(brief).slice(0, 6);
    const resp = await fetch(`/api/trending?markets=${encodeURIComponent(markets.join(','))}&subs=${encodeURIComponent(subs.join(','))}`);
    if (!resp.ok) return [];
    const d = await resp.json();
    if (d.errors?.length) console.warn('Trending sources failed:', d.errors);
    const trim = t => (t.length > 70 ? t.slice(0, 67) + '…' : t);
    const base = { date: TODAY_ISO, cat: 'Pop Culture', isLive: true, isTrending: true,
                   tags: ['trending', 'internet culture', 'viral', 'right now', 'social media'] };
    const google = (d.google || []).map((t, i) => ({
      ...base,
      id: `gtrend_${t.market}_${t.title}`.replace(/\W+/g, '_'),
      name: `Trending search: ${trim(t.title)}`,
      region: MARKETS.find(m => m.code === t.market)?.name || t.market,
      mkts: [t.market],
      rel: `${t.traffic.toLocaleString()}+ Google searches today${t.headline ? ' · ' + t.headline : ''}`,
      pri: t.traffic >= 20000 ? 'HIGH' : t.traffic >= 2000 ? 'MEDIUM' : 'LOW',
      source: 'Google Trends', url: t.url,
    }));
    const bsky = (d.bluesky || []).map(t => ({
      ...base,
      id: `bsky_${t.title}`.replace(/\W+/g, '_'),
      name: `Trending on Bluesky: ${trim(t.title)}`,
      region: 'Global', mkts: ['GLOBAL'],
      rel: t.headline, pri: 'MEDIUM', source: 'Bluesky', url: t.url,
    }));
    const reddit = (d.reddit || []).slice(0, 10).map((p, i) => ({
      ...base,
      id: `reddit_${p.url}`.replace(/\W+/g, '_').slice(0, 80),
      name: trim(p.title),
      date: p.updated || TODAY_ISO,
      region: 'r/' + p.sub,
      mkts: markets.length ? markets : ['GLOBAL'],
      rel: `Hot right now on r/${p.sub}`,
      pri: i < 3 ? 'MEDIUM' : 'LOW', source: 'Reddit', url: p.url,
    }));
    const yt = (d.youtube || []).slice(0, 30).map(v => ({
      ...base,
      id: `yt_${v.market}_${v.url}`.replace(/\W+/g, '_'),
      name: `Trending on YouTube: ${trim(v.title)}`,
      region: MARKETS.find(m => m.code === v.market)?.name || v.market,
      mkts: [v.market],
      rel: `${v.views.toLocaleString()} views · ${v.channel}`,
      pri: v.views >= 1e6 ? 'HIGH' : v.views >= 2e5 ? 'MEDIUM' : 'LOW',
      source: 'YouTube', url: v.url,
    }));
    // Seen in many hourly snapshots this week — sustained trends, not one-hour spikes
    const rising = (d.rising || []).map(t => ({
      ...base,
      id: `rising_${t.source}_${t.market}_${t.title}`.replace(/\W+/g, '_'),
      name: `Trending all week: ${trim(t.title)}`,
      region: MARKETS.find(m => m.code === t.market)?.name || t.market,
      mkts: [t.market],
      rel: `Trending on ${t.source} for ${t.hours} hours since ${formatDate(t.first.slice(0, 10))}${t.detail ? ' · ' + t.detail : ''}`,
      pri: t.hours >= 24 ? 'HIGH' : 'MEDIUM',
      tags: [...base.tags, 'sustained trend', 'this week'],
      source: t.source, url: t.url,
    }));
    const wiki = (d.wikipedia || []).map(w => ({
      ...base,
      id: `wikirise_${w.market}_${w.title}`.replace(/\W+/g, '_'),
      name: `Spiking on Wikipedia: ${trim(w.title)}`,
      date: w.date,
      region: MARKETS.find(m => m.code === w.market)?.name || w.market,
      mkts: [w.market],
      rel: `${w.views.toLocaleString()} views in ${MARKETS.find(m => m.code === w.market)?.name || w.market} · ${w.ratio}× its usual traffic`,
      pri: w.ratio >= 10 ? 'HIGH' : 'MEDIUM',
      source: 'Wikipedia', url: w.url,
    }));
    return [...rising, ...google, ...yt, ...wiki, ...bsky, ...reddit];
  } catch (e) {
    console.warn('Trending fetch failed:', e);
    return [];
  }
}

async function fetchBandsintownGigs(artists, markets) {
  if (!artists || artists.length === 0) return [];
  try {
    const appId = 'orbit';
    const today = new Date();
    const yearAhead = new Date(today.getTime() + 365 * 24 * 60 * 60 * 1000);

    // Build a set of city/country keywords for the selected markets
    const marketKeywords = new Set(['global']);
    (markets.length > 0 ? markets : ['AU']).forEach(m => {
      (MARKET_CITIES[m] || []).forEach(c => marketKeywords.add(c.toLowerCase()));
    });

    const gigResults = [];
    const artistSlice = artists.slice(0, 10); // cap at 10 artists

    await Promise.allSettled(artistSlice.map(async artist => {
      try {
        const url = IS_NETLIFY
          ? `/api/bandsintown/artists/${encodeURIComponent(artist)}/events?date=upcoming`
          : `https://rest.bandsintown.com/artists/${encodeURIComponent(artist)}/events?app_id=${appId}&date=upcoming`;
        const resp = await fetch(url, { headers: { 'Accept': 'application/json' } });
        if (!resp.ok) return;
        const events = await resp.json();
        if (!Array.isArray(events)) return;

        events.forEach(evt => {
          if (!evt.datetime) return;
          const evtDate = new Date(evt.datetime);
          if (evtDate < today || evtDate > yearAhead) return;

          // Check market match
          const venue = evt.venue || {};
          const locationStr = [venue.city, venue.region, venue.country, venue.name]
            .filter(Boolean).join(' ').toLowerCase();
          const inMarket = markets.length === 0 || [...marketKeywords].some(kw => locationStr.includes(kw));
          if (!inMarket) return;

          const dateStr = evtDate.toISOString().split('T')[0];
          const cityDisplay = [venue.city, venue.country].filter(Boolean).join(', ');

          gigResults.push({
            id: `bandsintown_${artist.replace(/\s+/g,'_')}_${evt.id}`,
            name: `${artist} — Live at ${venue.name || cityDisplay}`,
            date: dateStr,
            cat: 'Music & Festivals',
            region: cityDisplay || 'TBC',
            mkts: markets.length > 0 ? markets : ['GLOBAL'],
            rel: `${artist} live show`,
            pri: 'HIGH',
            tags: ['live music','gig','concert','tour',artist.toLowerCase()],
            isLive: true,
            source: 'Bandsintown',
            artistName: artist,
            venueName: venue.name || '',
            url: evt.url || `https://www.bandsintown.com/a/${encodeURIComponent(artist)}`
          });
        });
      } catch (e) { /* silently skip failed artist */ }
    }));

    // Deduplicate by artist+date (same artist can have multiple dates — keep them all, just cap per artist at 2)
    const byArtist = {};
    gigResults.forEach(g => {
      if (!byArtist[g.artistName]) byArtist[g.artistName] = [];
      byArtist[g.artistName].push(g);
    });
    const deduped = Object.values(byArtist).flatMap(gigs =>
      gigs.sort((a, b) => a.date.localeCompare(b.date)).slice(0, 2)
    );

    return deduped.sort((a, b) => a.date.localeCompare(b.date)).slice(0, 12);
  } catch (e) {
    console.warn('Bandsintown fetch failed:', e);
    return [];
  }
}

// CAMPAIGN WINDOW & MARKET FIT
// ─────────────────────────────────────────────────────────────────────────────
const WINDOW_BUFFER_DAYS = 21;  // moments this close outside the window are kept but flagged
const DAY_MS = 864e5;

// AI-extracted window from the brief; defaults to the next 3 months. Never starts before today.
function resolveCampaignWindow(w) {
  const iso = /^\d{4}-\d{2}-\d{2}$/;
  let start = w && iso.test(w.start) ? w.start : TODAY_ISO;
  let end = w && iso.test(w.end) ? w.end : null;
  if (start < TODAY_ISO) start = TODAY_ISO;
  if (!end || end < start) {
    const d = new Date(start); d.setMonth(d.getMonth() + 3);
    end = d.toISOString().slice(0, 10);
  }
  return { start, end, fromBrief: !!(w && iso.test(w.end || '')) };
}

// Keeps events overlapping the window; within the buffer they're kept with e.timing set; else dropped
function tagTiming(e, w) {
  const s = e.date.length === 7 ? e.date + '-01' : e.date;
  const f = e.end || s;
  delete e.timing;
  if (f >= w.start && s <= w.end) return true;
  const gap = s > w.end ? (new Date(s) - new Date(w.end)) / DAY_MS : (new Date(w.start) - new Date(f)) / DAY_MS;
  if (gap > WINDOW_BUFFER_DAYS) return false;
  e.timing = { side: s > w.end ? 'after' : 'before', days: Math.round(gap) };
  return true;
}

// With markets selected: keep events in those markets; global ones only if they're big
// (HIGH priority, or trending) AND the AI rated them a direct fit to the brief
function fitsMarkets(e, markets, fit) {
  if (e.isTrending && fit !== 'direct') return false;  // trends only when clearly on-brief
  if (!markets.length) return fit !== 'stretch' || e.pri === 'HIGH';
  const mkts = e.mkts || [];
  if (mkts.some(m => markets.includes(m))) return true;
  return mkts.includes('GLOBAL') && (e.pri === 'HIGH' || e.isTrending) && fit === 'direct';
}

// The AI sometimes returns the same moment twice (same id, or DB + generated copy)
function uniqueMoment() {
  const seen = new Set();
  const norm = n => (n || '').toLowerCase().replace(/\b20\d\d\b|\(.*?\)/g, '').replace(/[^a-z0-9]+/g, ' ').trim();
  return ({ event }) => {
    const keys = [event.id, norm(event.name)];
    if (keys.some(k => seen.has(k))) return false;
    keys.forEach(k => seen.add(k));
    return true;
  };
}

function timingBadge(e) {
  if (!e.timing) return '';
  const wk = Math.max(1, Math.round(e.timing.days / 7));
  return `<span class="card-timing-badge" title="Outside the campaign window, but close enough to consider">⏱ ${wk} wk ${e.timing.side} window</span>`;
}

  let q = Math.floor(now.getMonth() / 3), y = now.getFullYear();
  return Array.from({length: 4}, () => {
    const out = {label: `Q${q+1} ${y} ${QUARTER_NAMES[q]}`, year: y, months: [q*3+1, q*3+2, q*3+3]};
    if (++q === 4) { q = 0; y++; }
    return out;
  });
})();

function renderQuarterFilter() {
  const row = document.getElementById('quarter-filter-row');
  row.innerHTML = '';
  QUARTERS.forEach((q,i) => {
    const btn = document.createElement('button');
    btn.className = 'month-chip' + (selectedQuarters.includes(i) ? ' active' : '');
    btn.textContent = q.label;
    btn.onclick = () => {
      const idx = selectedQuarters.indexOf(i);
      if (idx > -1) selectedQuarters.splice(idx,1); else selectedQuarters.push(i);
      renderQuarterFilter();
    };
    row.appendChild(btn);
  });
}

// FILTER EVENTS (market / category / quarter — pre-filter before sending to AI)
// ─────────────────────────────────────────────────────────────────────────────
function preFilterEvents() {
  return EVENTS.filter(e => {
    if (selectedMarkets.length > 0) {
      const ok = e.mkts.includes('GLOBAL') || e.mkts.some(m => selectedMarkets.includes(m));
      if (!ok) return false;
    }
    if (selectedCats.length > 0 && !selectedCats.includes(e.cat)) return false;
    if (selectedQuarters.length > 0) {
      const [year, month] = e.date.split('-').map(Number);
      const inQ = selectedQuarters.some(qi => QUARTERS[qi].year === year && QUARTERS[qi].months.includes(month));
      if (!inQ) return false;
    }
    return true;
  });
}

const CAT_EMOJI = {
  'Music & Festivals':      '♪',
  'Sports':                 '◈',
  'Film & TV':              '▶',
  'Cultural & Religious':   '✦',
  'Public Holidays':        '◎',
  'Historical Anniversary': '⟳',
  'Awards Shows':           '★',
  'Pop Culture':            '◉',
  'Australia':              '◆',
};

function extractClientName(brief) {
  // Skip-words that appear capitalised but aren't brand names
  const SKIP = new Set(['The','A','An','We','Our','This','They','Their','Its','It','In','On','At','To','For','Of','And','Or','But','With','From','By','As','Is','Are','Was','Were','Has','Have','Had','Will','Would','Could','Should','May','Can','Be','Been','Being','That','Which','Who','What','When','Where','How','Why','Pitch','Information','Type','Brief','Campaign','Brand','Strategy','Overview','Summary','Background','Objective','Target','Audience','Market','Key','Main','Core','Primary','Secondary','New','Old','Big','Small','Launch','Product','Service','Initiative','Project','Program','Plan','Insight','Creative','Digital','Social','Media','Content','Channel','Platform','Agency','Client','Account','Budget','Scope','Deliverable','Timeline','Date','Quarter','Year','Month','Week','RFP','CRM','SOW','NDA','TBC','TBD','FYI','CEO','CMO','CFO','COO','VP','SVP','EVP','MD','AU','NZ','UK','US','APAC','EMEA','GLOBAL','EOFY','Q1','Q2','Q3','Q4']);

  const clientPatterns = [
    // Explicit field labels
    /Account Name[:\s]+([^\n]{2,40}?)(?:\s*\n|$)/i,
    /client[:\s]+([A-Za-z][a-zA-Z\s&'.-]{2,30}?)(?:\s*\n|[,.]|$)/i,
    /brand[:\s]+([A-Za-z][a-zA-Z\s&'.-]{2,30}?)(?:\s*\n|[,.]|$)/i,
    // "for [Brand] campaign/brief/RFP/pitch"
    /\bfor\s+([A-Z][a-zA-Z&'.-]+(?:\s+[A-Z][a-zA-Z&'.-]+){0,2})\s+(?:campaign|brief|brand|pitch|RFP|launch|activation)/i,
    // "[Brand] is launching/opening/expanding..."
    /([A-Z][a-zA-Z&'.-]+(?:\s+[A-Z][a-zA-Z&'.-]+){0,2})\s+is\s+(?:opening|launching|expanding|introducing|partnering|releasing|rolling out)/i,
    // "[Brand] AU/Australia brief" or "the [Brand] brief"
    /([A-Z][a-zA-Z&'.-]+(?:\s+[A-Z][a-zA-Z&'.-]+){0,2})\s+(?:AU|Australia|Global|APAC)\s+(?:brief|campaign)/i,
    /\bthe\s+([A-Z][a-zA-Z&'.-]+(?:\s+[A-Z][a-zA-Z&'.-]+){0,1})\s+(?:brief|campaign|pitch|brand)/i,
    // All-caps brand code in context: "KFC brief", "for KFC", "KFC's", "KFC is"
    /\b([A-Z]{2,6})\s*(?:'s|is\b|brief|campaign|brand|launch|pitch|RFP|AU\b|Australia)/,
    /(?:for|of)\s+([A-Z]{2,6})\b/,
    // Salesforce-style header: standalone brand name on its own line (skip known doc headers)
    /^([A-Z][a-zA-Z&'.-]{2,25}(?:\s+[A-Z][a-zA-Z&'.-]{2,15}){0,2})\s*(?:\n|$)/m,
  ];

  for (const pat of clientPatterns) {
    const m = brief.match(pat);
    if (m && m[1]) {
      const candidate = m[1].trim().replace(/[:.,$]+$/, '');
      const words = candidate.split(/\s+/);
      if (candidate.length > 2 && words.length <= 4 && !SKIP.has(words[0])) {
        return candidate;
      }
    }
  }

  // Fallback: find the first prominent all-caps or title-case word that isn't a stop word
  const allCaps = brief.match(/\b([A-Z]{2,12})\b/g);
  if (allCaps) {
    const filtered = allCaps.filter(w => !SKIP.has(w) && w.length >= 3 && w !== w.toLowerCase());
    if (filtered.length > 0) return filtered[0];
  }

  // Last resort: first multi-word capitalised phrase
  const capMatch = brief.match(/([A-Z][a-z]+(?:\s+[A-Z][a-z]+){1,2})/);
  if (capMatch && !SKIP.has(capMatch[1].split(' ')[0])) return capMatch[1];
  return 'Your Brief';
}

function renderConstellation(rankedEvents, brief) {
  const svg = document.getElementById('constellation-svg');
  const container = document.getElementById('constellation-container');
  const detail = document.getElementById('constellation-detail');
  svg.innerHTML = '';
  detail.innerHTML = '';
  detail.classList.remove('visible');

  const CX = 450, CY = 300;
  const rings = [
    { radius: 170, maxNodes: 3,  size: 72,  glowColor: '#1ED760',              borderColor: '#1ED760' },
    { radius: 290, maxNodes: 5,  size: 52,  glowColor: 'rgba(155,89,182,0.8)', borderColor: '#9b59b6' },
    { radius: 400, maxNodes: 99, size: 36,  glowColor: 'rgba(180,180,180,0.4)',borderColor: '#555' },
  ];

  // Distribute events into rings
  const ring1 = rankedEvents.slice(0, 3);
  const ring2 = rankedEvents.slice(3, 8);
  const ring3 = rankedEvents.slice(8);

  const clientName = extractClientName(brief);

  // Defs for filters
  const defs = document.createElementNS('http://www.w3.org/2000/svg','defs');
  defs.innerHTML = `
    <filter id="glow-green" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-purple" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  `;
  svg.appendChild(defs);

  // Faint ring circles
  [170, 290, 400].forEach(r => {
    const circle = document.createElementNS('http://www.w3.org/2000/svg','circle');
    circle.setAttribute('cx', CX); circle.setAttribute('cy', CY);
    circle.setAttribute('r', r);
    circle.setAttribute('fill','none');
    circle.setAttribute('stroke','rgba(255,255,255,0.04)');
    circle.setAttribute('stroke-width','1');
    circle.setAttribute('stroke-dasharray','4 8');
    svg.appendChild(circle);
  });

  // Center connecting lines to ring 1 nodes
  const linesGroup = document.createElementNS('http://www.w3.org/2000/svg','g');
  linesGroup.setAttribute('id','constellation-lines');
  svg.appendChild(linesGroup);

  // Center label group
  const centerGroup = document.createElementNS('http://www.w3.org/2000/svg','g');
  const centerCircle = document.createElementNS('http://www.w3.org/2000/svg','circle');
  centerCircle.setAttribute('cx',CX); centerCircle.setAttribute('cy',CY);
  centerCircle.setAttribute('r','56');
  centerCircle.setAttribute('fill','#1a1a1a');
  centerCircle.setAttribute('stroke','#1ED760');
  centerCircle.setAttribute('stroke-width','1.5');
  centerGroup.appendChild(centerCircle);

  const fo = document.createElementNS('http://www.w3.org/2000/svg','foreignObject');
  fo.setAttribute('x', CX - 46); fo.setAttribute('y', CY - 30);
  fo.setAttribute('width','92'); fo.setAttribute('height','60');
  fo.innerHTML = `<div xmlns="http://www.w3.org/1999/xhtml" style="color:#fff;font-size:11px;font-weight:800;text-align:center;line-height:1.3;word-wrap:break-word;overflow:hidden;max-height:60px">${clientName}</div>`;
  centerGroup.appendChild(fo);
  svg.appendChild(centerGroup);

  // Helper to place a ring of nodes
  function placeNodes(nodes, ringCfg, ringIndex) {
    const count = nodes.length;
    const offsetAngle = ringIndex * 0.4; // slight phase offset per ring
    nodes.forEach(({event, reason}, idx) => {
      const angle = (2 * Math.PI / count) * idx + offsetAngle - Math.PI / 2;
      const nx = CX + ringCfg.radius * Math.cos(angle);
      const ny = CY + ringCfg.radius * Math.sin(angle);
      const rank = rankedEvents.indexOf(rankedEvents.find(r => r.event.id === event.id)) + 1;
      const emoji = CAT_EMOJI[event.cat] || '●';
      const r = ringCfg.size / 2;
      const color = catColor(event.cat);

      // Line from center (ring 1 only)
      if (ringIndex === 0) {
        const line = document.createElementNS('http://www.w3.org/2000/svg','line');
        line.setAttribute('x1', CX); line.setAttribute('y1', CY);
        line.setAttribute('x2', nx); line.setAttribute('y2', ny);
        line.setAttribute('stroke', 'rgba(255,255,255,0.08)');
        line.setAttribute('stroke-width','1');
        linesGroup.appendChild(line);
      }

      // Node group
      const g = document.createElementNS('http://www.w3.org/2000/svg','g');
      g.setAttribute('class','constellation-node');
      g.setAttribute('data-rank', rank);
      g.setAttribute('style', `color:${ringCfg.borderColor}`);
      g.setAttribute('filter', ringIndex === 0 ? 'url(#glow-green)' : ringIndex === 1 ? 'url(#glow-purple)' : '');

      // Circle background
      const bg = document.createElementNS('http://www.w3.org/2000/svg','circle');
      bg.setAttribute('class','node-bg');
      bg.setAttribute('cx', nx); bg.setAttribute('cy', ny);
      bg.setAttribute('r', r);
      bg.setAttribute('fill','#0e0e0e');
      bg.setAttribute('stroke', ringCfg.borderColor);
      bg.setAttribute('stroke-width','1.5');
      g.appendChild(bg);

      // Emoji
      const emojiText = document.createElementNS('http://www.w3.org/2000/svg','text');
      emojiText.setAttribute('x', nx); emojiText.setAttribute('y', ny + 5);
      emojiText.setAttribute('text-anchor','middle');
      emojiText.setAttribute('font-size', Math.round(r * 0.7));
      emojiText.setAttribute('fill', ringIndex === 0 ? '#1ED760' : ringIndex === 1 ? '#9b59b6' : '#888');
      emojiText.textContent = emoji;
      g.appendChild(emojiText);

      // Rank badge
      const rankText = document.createElementNS('http://www.w3.org/2000/svg','text');
      rankText.setAttribute('x', nx + r * 0.65); rankText.setAttribute('y', ny - r * 0.65);
      rankText.setAttribute('text-anchor','middle');
      rankText.setAttribute('font-size','9');
      rankText.setAttribute('font-weight','700');
      rankText.setAttribute('fill','rgba(255,255,255,0.6)');
      rankText.textContent = rank;
      g.appendChild(rankText);

      // Label below node
      const labelText = document.createElementNS('http://www.w3.org/2000/svg','text');
      labelText.setAttribute('x', nx); labelText.setAttribute('y', ny + r + 14);
      labelText.setAttribute('text-anchor','middle');
      labelText.setAttribute('font-size','9');
      labelText.setAttribute('fill','#777');
      const shortName = event.name.length > 22 ? event.name.substring(0,20)+'…' : event.name;
      labelText.textContent = shortName;
      g.appendChild(labelText);

      // Click handler
      g.addEventListener('click', () => {
        // Deselect all
        svg.querySelectorAll('.constellation-node').forEach(n => {
          n.classList.remove('selected');
          n.querySelector('.node-bg').setAttribute('stroke-width','1.5');
        });
        g.classList.add('selected');
        g.querySelector('.node-bg').setAttribute('stroke-width','3');

        // Show detail panel
        const marketHtml = event.mkts.includes('GLOBAL')
          ? `<span class="market-tag global">🌍 Global</span>`
          : event.mkts.map(m => {
              const mkt = MARKETS.find(x => x.code === m);
              return mkt ? `<span class="market-tag">${mkt.flag} ${mkt.name}</span>` : '';
            }).join('');

        detail.innerHTML = `
          <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
            <span style="font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:${ringCfg.borderColor}">✦ Rank ${rank}</span>
            <span class="cat-badge" style="--cat-c:${color}">${catLabel(event.cat)}</span>
          </div>
          <div class="detail-name">${event.name}</div>
          <div class="detail-meta">${formatDate(event.date)} · ${event.region} ${timingBadge(event)}</div>
          ${reason ? `<div class="detail-reason">✦ ${reason}</div>` : `<div class="detail-reason">♪ ${event.rel}</div>`}
          <div class="detail-markets">${marketHtml}</div>
        `;
        detail.classList.add('visible');
      });

      svg.appendChild(g);
    });
  }

  placeNodes(ring1, rings[0], 0);
  placeNodes(ring2, rings[1], 1);
  placeNodes(ring3, rings[2], 2);

  container.style.display = 'block';
}

async function runSearch() {
  const brief   = document.getElementById('brief-input').value.trim();
  const btn     = document.getElementById('search-btn');
  const section  = document.getElementById('results-section');
  const grid     = document.getElementById('cards-grid');
  const title    = document.getElementById('results-title');
  const meta     = document.getElementById('results-meta');
  const divider  = document.getElementById('results-divider');

  section.classList.remove('hidden');
  divider.classList.remove('hidden');
  grid.innerHTML = '';

  if (!brief) {
    // No brief — just show filtered events without AI
    const filtered = preFilterEvents();
    const mktLabel = selectedMarkets.length
      ? MARKETS.filter(m => selectedMarkets.includes(m.code)).map(m => m.flag+' '+m.name).join(', ')
      : 'all markets';
    title.innerHTML = `<span class="count">${filtered.length}</span> moment${filtered.length !== 1 ? 's' : ''} found`;
    meta.textContent = `Showing ${mktLabel} — enter a brief for AI-powered ranking`;
    const regGrid = document.createElement('div');
    regGrid.className = 'cards-regular-grid';
    filtered.forEach((e, i) => regGrid.appendChild(makeCard(e, i, null)));
    grid.appendChild(regGrid);
    section.scrollIntoView({behavior:'smooth', block:'start'});
    return;
  }

  // Show loading state
  btn.disabled = true;
  btn.textContent = 'Finding moments…';
  title.innerHTML = 'Thinking…';
  meta.textContent = 'AI is reading your brief and scanning all cultural moments.';
  grid.innerHTML = `<div class="loading-state">
    <div class="loading-pulse"></div>
    <div class="loading-text">Finding your moments…</div>
    <div class="loading-sub">Analysing your brief across 170+ cultural moments</div>
  </div>`;
  section.scrollIntoView({behavior:'smooth', block:'start'});

  try {
    const candidateEvents = preFilterEvents();

    // Fetch live events in parallel
    document.querySelector('.loading-text').textContent = 'Pulling live data: Google Trends, YouTube, Wikipedia, Bluesky, Reddit, holidays & more…';
    const [tmEvents, tmdbEvents, guardianEvents, trendEvents, calendarEvents, albumEvents] = await Promise.all([
      fetchTicketmasterEvents(selectedMarkets),
      fetchTMDBReleases(),
      fetchGuardianNews(brief, selectedMarkets),
      fetchTrending(brief, selectedMarkets),
      fetchCalendarDates(selectedMarkets),
      fetchAlbumAnniversaries()
    ]);
    const liveEvents = [
      ...tmEvents, ...tmdbEvents, ...guardianEvents, ...trendEvents,
      ...dedupeAgainst(candidateEvents, [...calendarEvents, ...albumEvents])
    ];

    // Merge: curated DB + live events (deduplicated by name similarity won't matter at AI stage)
    const allCandidates = [...candidateEvents, ...liveEvents];

    document.querySelector('.loading-text').textContent = 'AI is ranking your moments…';
    const { dbResults, generatedEvents, relevantArtists, campaignWindow } = await rankEventsWithAI(brief, allCandidates);

    // Fetch live gig data from Bandsintown using AI-suggested artists
    let gigEvents = [];
    if (relevantArtists && relevantArtists.length > 0) {
      document.querySelector('.loading-text').textContent = `Finding live gigs for ${relevantArtists.slice(0,3).join(', ')}…`;
      gigEvents = await fetchBandsintownGigs(relevantArtists, selectedMarkets);
    }

    // Map DB results back to full event objects
    const eventById = {};
    allCandidates.forEach(e => { eventById[e.id] = e; });

    const dbRanked = dbResults
      .filter(r => eventById[r.id])
      .map(r => ({ event: eventById[r.id], reason: r.reason, fit: r.fit }))
      .filter(({ event }) => _tonalyFilter(event.name, event.cat));

    // Merge generated events and gig events (interleaved after top 3 DB results)
    const generatedRanked = generatedEvents.map(e => ({ event: e, reason: e.reason, fit: e.fit }));
    const gigRanked = gigEvents.map(e => ({ event: e, reason: `Live ${e.artistName} show in ${e.region} — a direct audience activation opportunity.` }));
    const window_ = resolveCampaignWindow(campaignWindow);
    const fits = ({ event, fit }) => fitsMarkets(event, selectedMarkets, fit) && tagTiming(event, window_);
    const rankedEvents = [
      ...dbRanked.slice(0, 3),
      ...generatedRanked,
      ...gigRanked,
      ...dbRanked.slice(3)
    ].filter(fits).filter(uniqueMoment());

    grid.innerHTML = '';

    if (rankedEvents.length === 0) {
      title.innerHTML = 'No moments found';
      meta.textContent = 'Try broadening your brief or adjusting your filters.';
      document.getElementById('view-toggle-row').style.display = 'none';
      document.getElementById('constellation-container').style.display = 'none';
      document.getElementById('constellation-detail').classList.remove('visible');
      grid.innerHTML = `
        <div class="empty-state" style="grid-column:1/-1">
          <div class="emoji">🔍</div>
          <h3>Nothing matched</h3>
          <p>Try a different brief, remove market filters, or browse all events below.</p>
        </div>`;
    } else {
      const mktLabel = selectedMarkets.length
        ? MARKETS.filter(m => selectedMarkets.includes(m.code)).map(m => m.flag+' '+m.name).join(', ')
        : 'all markets';
      title.innerHTML = `<span class="count">${rankedEvents.length}</span> moment${rankedEvents.length !== 1 ? 's' : ''} found`;
      meta.innerHTML = `AI-matched to: "${brief.substring(0,80)}${brief.length>80?'…':''}" · ${mktLabel} · ${window_.fromBrief ? 'Campaign' : 'Next 3 months'}: ${formatDate(window_.start)} – ${formatDate(window_.end)} (±3 wk buffer)${generatedRanked.length > 0 ? ` · <span style="color:var(--green)">+${generatedRanked.length} AI-sourced</span>` : ''}`;

      // Show constellation by default
      currentView = 'orbit';
      renderConstellation(rankedEvents, brief);
      document.getElementById('view-toggle-row').style.display = 'flex';
      document.getElementById('orbit-view-btn').classList.add('active');
      document.getElementById('list-view-btn').classList.remove('active');
      grid.style.display = 'none';

      // Build list view cards (hidden by default)
      const listFragment = document.createDocumentFragment();
      const [top, ...rest] = rankedEvents;
      if (top) {
        listFragment.appendChild(makeFeaturedCard(top.event, top.reason));
      }
      const duo = rest.slice(0, 2);
      const remaining = rest.slice(2);
      if (duo.length > 0) {
        const duoGrid = document.createElement('div');
        duoGrid.className = 'cards-duo-grid';
        duo.forEach(({event, reason}, i) => duoGrid.appendChild(makeSemiCard(event, i + 2, reason)));
        listFragment.appendChild(duoGrid);
      }
      if (remaining.length > 0) {
        const regGrid = document.createElement('div');
        regGrid.className = 'cards-regular-grid';
        remaining.forEach(({event, reason}, i) => regGrid.appendChild(makeCard(event, i + 3, reason)));
        listFragment.appendChild(regGrid);
      }
      grid.innerHTML = '';
      grid.appendChild(listFragment);
    }
  } catch (err) {
    grid.innerHTML = '';
    title.innerHTML = 'Something went wrong';
    meta.textContent = err.message;
    grid.innerHTML = `
      <div class="empty-state" style="grid-column:1/-1">
        <div class="emoji">⚠️</div>
        <h3>API Error</h3>
        <p>${err.message}</p>
      </div>`;
  } finally {
    btn.disabled = false;
    btn.textContent = 'Find Moments';
  }

  section.scrollIntoView({behavior:'smooth', block:'start'});
}

// ─────────────────────────────────────────────────────────────────────────────
// BROWSE ALL
// ─────────────────────────────────────────────────────────────────────────────
let browseCatFilter = [];

function renderBrowse() {
  const section   = document.getElementById('browse-section');
  const timeline  = document.getElementById('browse-timeline');
  const countEl   = document.getElementById('browse-count');
  const filterBar = document.getElementById('browse-filters');

  // Cat filter chips
  filterBar.innerHTML = '<button class="cat-chip" id="browse-all-chip" style="--cat-color:#fff;border-color:#fff;color:#fff">All</button>';
  document.getElementById('browse-all-chip').onclick = () => {
    browseCatFilter = [];
    document.querySelectorAll('#browse-filters .cat-chip').forEach(c => {
      c.style.background = ''; c.style.borderColor = 'var(--border)'; c.style.color = 'var(--grey)';
    });
    renderBrowseTimeline();
  };

  Object.entries(CATEGORIES).forEach(([cat, cfg]) => {
    const btn = document.createElement('button');
    btn.className = 'cat-chip';
    btn.style.setProperty('--cat-color', cfg.color);
    btn.innerHTML = `<span class="dot" style="background:${cfg.color}"></span>${cfg.label}`;
    btn.onclick = () => {
      const i = browseCatFilter.indexOf(cat);
      if (i > -1) { browseCatFilter.splice(i,1); btn.style.background=''; btn.style.borderColor='var(--border)'; btn.style.color='var(--grey)'; }
      else { browseCatFilter.push(cat); btn.style.background=cfg.color; btn.style.borderColor=cfg.color; btn.style.color='#000'; }
      renderBrowseTimeline();
    };
    filterBar.appendChild(btn);
  });

  renderBrowseTimeline();
  section.classList.remove('hidden');
  section.scrollIntoView({behavior:'smooth', block:'start'});
}

function renderBrowseTimeline() {
  const timeline = document.getElementById('browse-timeline');
  const countEl  = document.getElementById('browse-count');

  let evts = EVENTS;
  if (selectedMarkets.length > 0) {
    evts = evts.filter(e => e.mkts.includes('GLOBAL') || e.mkts.some(m => selectedMarkets.includes(m)));
  }
  if (browseCatFilter.length > 0) {
    evts = evts.filter(e => browseCatFilter.includes(e.cat));
  }

  countEl.textContent = `${evts.length} events`;

  const monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const byMonth = {};
  evts.forEach(e => {
    const m = (e.date < TODAY_ISO ? TODAY_ISO : e.date).slice(0, 7);  // YYYY-MM; ongoing events show under this month
    if (!byMonth[m]) byMonth[m] = [];
    byMonth[m].push(e);
  });

  timeline.innerHTML = '';
  Object.keys(byMonth).sort().forEach(m => {
    const block = document.createElement('div');
    block.className = 'month-block fade-up';
    const label = document.createElement('div');
    label.className = 'month-label';
    const [yr, mo] = m.split('-');
    label.textContent = monthNames[parseInt(mo)-1] + ' ' + yr;
    block.appendChild(label);

    byMonth[m].forEach(e => {
      const row = document.createElement('div');
      row.className = 'browse-event';
      const color = catColor(e.cat);
      const mktFlags = e.mkts.includes('GLOBAL') ? '🌍' : e.mkts.map(c => MARKETS.find(x=>x.code===c)?.flag || '').join('');
      row.innerHTML = `
        <span class="browse-date">${formatDate(e.date).replace(/ \d{4}$/,'')}</span>
        <span class="browse-dot" style="background:${color}"></span>
        <div class="browse-content">
          <div class="browse-name">${e.name}</div>
          <div class="browse-relevance">♪ ${e.rel}</div>
        </div>
        <span class="browse-cat" style="color:${color}">${catLabel(e.cat)}</span>
        <span style="font-size:13px;margin-left:4px">${mktFlags}</span>
      `;
      block.appendChild(row);
    });
    timeline.appendChild(block);
  });
}

// ─────────────────────────────────────────────────────────────────────────────
// INIT
// ─────────────────────────────────────────────────────────────────────────────
function init() {
  renderMarketChips();
  renderCatFilter();
  renderQuarterFilter();

  const total = EVENTS.length;
  document.getElementById('footer-count').textContent = `${total} cultural moments · 12 markets`;

  // Search button
  document.getElementById('search-btn').onclick = runSearch;

  // Enter key in textarea
  document.getElementById('brief-input').addEventListener('keydown', e => {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) runSearch();
  });

  // Clear
  document.getElementById('clear-btn').onclick = () => {
    document.getElementById('brief-input').value = '';
    selectedCats = []; selectedQuarters = [];
    renderCatFilter(); renderQuarterFilter();
    document.getElementById('results-section').classList.add('hidden');
    document.getElementById('results-divider').classList.add('hidden');
    document.getElementById('cards-grid').innerHTML = '';
    document.getElementById('constellation-container').style.display = 'none';
    document.getElementById('constellation-detail').classList.remove('visible');
    document.getElementById('view-toggle-row').style.display = 'none';
  };

  // View toggle (orbit / list)
  document.getElementById('orbit-view-btn').addEventListener('click', () => {
    currentView = 'orbit';
    document.getElementById('orbit-view-btn').classList.add('active');
    document.getElementById('list-view-btn').classList.remove('active');
    document.getElementById('constellation-container').style.display = 'block';
    document.getElementById('cards-grid').style.display = 'none';
  });
  document.getElementById('list-view-btn').addEventListener('click', () => {
    currentView = 'list';
    document.getElementById('list-view-btn').classList.add('active');
    document.getElementById('orbit-view-btn').classList.remove('active');
    document.getElementById('constellation-container').style.display = 'none';
    document.getElementById('constellation-detail').classList.remove('visible');
    document.getElementById('cards-grid').style.display = '';
  });

  // Filter toggle
  document.getElementById('filter-toggle').onclick = function() {
    this.classList.toggle('open');
    document.getElementById('filter-panel').classList.toggle('open');
  };

  // Browse buttons
  function toggleBrowse() {
    browseOpen = !browseOpen;
    if (browseOpen) {
      renderBrowse();
      document.getElementById('nav-browse-btn').textContent = '← Back to search';
    } else {
      document.getElementById('browse-section').classList.add('hidden');
      document.getElementById('nav-browse-btn').textContent = 'Browse all →';
    }
  }
  document.getElementById('nav-browse-btn').onclick = toggleBrowse;

  // Animated placeholder
  const placeholders = [
    'A campaign for a sportswear brand targeting 18–25s in Q3…',
    'Women\'s empowerment initiative — find the right cultural moments to align with…',
    'A nostalgia-driven campaign celebrating 90s hip-hop for a UK audience…',
    'Youth culture activation for a global brand launching in summer…',
    'A mental health awareness campaign — which moments should we build around?',
    'Brand partnership for a beauty brand in Australia this autumn…',
  ];
  let pi = 0;
  const inp = document.getElementById('brief-input');
  setInterval(() => {
    if (document.activeElement !== inp && !inp.value) {
      pi = (pi + 1) % placeholders.length;
      inp.placeholder = placeholders[pi];
    }
  }, 4000);
}

document.addEventListener('DOMContentLoaded', init);
</script>
